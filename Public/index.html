
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Beatify 🎶</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="background"></canvas>

  <div class="container">
    <h1>Beatify 🎵</h1>

    <div class="profile">
      <img id="avatar" src="https://placekitten.com/100/100" alt="Avatar" />
      <input type="file" id="avatarInput" accept="image/*" />
      <input type="text" id="usernameInput" placeholder="Adını yaz..." maxlength="20" />
    </div>

    <h2>Hoşgeldin, <span id="username">Misafir</span> 👋</h2>

    <div class="upload-section">
      <input type="file" id="audioUpload" accept="audio/*" />
      <button id="uploadBtn">Şarkı Yükle</button>
    </div>

    <h3>Şarkılarım</h3>
    <ul id="songList"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
