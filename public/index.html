<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Beatify 🎶</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="background"></canvas>

  <div class="container">
    <h1>Beatify 🎵</h1>

    <div class="profile">
      <img id="avatar" src="https://placekitten.com/100/100" alt="Avatar" />
      <input type="file" id="avatarInput" accept="image/*" />
      <input type="text" id="usernameInput" placeholder="Enter your name..." maxlength="20" />
    </div>

    <h2>Welcome, <span id="username">Guest</span> 👋</h2>

    <div class="upload-section">
      <input type="file" id="audioUpload" accept="audio/*" />

      <!-- Yeni alanlar -->
      <input type="text" id="songTitle" placeholder="Song Title" />
      <input type="text" id="artistName" placeholder="Artist" />

      <button id="uploadBtn">Upload Song</button>
    </div>

    <h3>Your Songs</h3>
    <ul id="songList"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
