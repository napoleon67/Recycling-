
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Beatify 🎶</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Beatify 🎵</h1>
    <div class="profile">
      <img id="avatar" src="https://placekitten.com/100/100" alt="Avatar">
      <input type="file" id="avatarInput" accept="image/*">
      <input type="text" id="usernameInput" placeholder="Adını yaz...">
    </div>
    <div class="welcome">
      <h2>Merhaba, <span id="username">Misafir</span> 👋</h2>
    </div>
    <div class="player">
      <p>Henüz bir şarkı çalmıyor...</p>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
